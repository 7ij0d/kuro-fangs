<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kuro Fangs Dental Platform — Year 3 Dentistry Academic System" />
  <meta name="theme-color" content="#881337" />
  <title>Kuro Fangs • Year 3 Dental Platform</title>

  <!-- Google Fonts: Plus Jakarta Sans (English) & Readex Pro (Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css?v=3.1" />
  <link rel="stylesheet" href="css/base.css?v=3.1" />
  <link rel="stylesheet" href="css/layout.css?v=3.1" />
  <link rel="stylesheet" href="css/components.css?v=3.1" />
</head>
<body>
  <!-- ==========================================================================
       THE FLOATING INTERACTIVE SUBJECT MODAL (Backdrop & Container)
       ========================================================================== -->
  <div id="subject-modal-backdrop" class="subject-modal-backdrop" aria-hidden="true">
    <div id="subject-modal-box" class="subject-modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <div class="app-wrapper">
    <!-- ==========================================================================
         TOP HEADER (Brand, Search, Nav, Lang & Theme Toggles)
         ========================================================================== -->
    <header class="site-header">
      <!-- Brand -->
      <a href="#/" class="header-brand">
        <div class="brand-emblem">🦷</div>
        <div class="brand-meta">
          <span class="brand-name-text" id="header-brand-name">Kuro Fangs</span>
          <span class="brand-sub-text" id="header-brand-sub">Faculty of Dentistry — Year 3</span>
        </div>
      </a>

      <!-- Center: Live Search Filter -->
      <div class="header-search-box">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="header-search-input" placeholder="Search subjects, lectures, or topics..." />
      </div>

      <!-- Right/Left Actions -->
      <div class="header-actions">
        <!-- Navigation Links -->
        <a href="#/" class="header-nav-btn active" title="Subjects" id="nav-subjects-link">
          <i data-lucide="book-open"></i>
          <span id="nav-subjects-text">Subjects</span>
        </a>

        <a href="#/calculator" class="header-nav-btn" title="GPA Calculator" id="nav-calc-link">
          <i data-lucide="calculator"></i>
          <span id="nav-calc-text">GPA Calc</span>
        </a>

        <a href="#/favorites" class="header-nav-btn" title="Bookmarks" id="nav-bookmarks-link">
          <i data-lucide="bookmark"></i>
          <span id="nav-bookmarks-text">Saved</span>
        </a>

        <!-- 1. Language Toggle Button (EN / AR) -->
        <button id="lang-toggle-btn" class="header-toggle-btn" title="Switch Language (English / العربية)">
          <i data-lucide="globe"></i>
          <span id="lang-btn-text">AR</span>
        </button>

        <!-- 2. Dark / Light Mode Toggle Button -->
        <button id="theme-toggle-btn" class="header-toggle-btn" title="Toggle Dark / Light Theme">
          <i data-lucide="moon" id="theme-icon"></i>
        </button>

        <!-- Points Pill -->
        <div class="points-pill" title="Academic Points">
          <i data-lucide="sparkles"></i>
          <span id="header-points-text">25 pts</span>
        </div>
      </div>
    </header>

    <!-- ==========================================================================
         MAIN CONTENT AREA (Subjects-First Direct View)
         ========================================================================== -->
    <main class="main-content" id="app" role="main"></main>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/i18n.js?v=3.1"></script>
  <script src="js/store.js?v=3.1"></script>
  <script src="js/data.js?v=3.1"></script>
  <script src="js/components/subject-modal.js?v=3.1"></script>
  <script src="js/router.js?v=3.1"></script>
  <script src="js/pages/home.js?v=3.1"></script>
  <script src="js/pages/calculator.js?v=3.1"></script>
  <script src="js/pages/quizzes.js?v=3.1"></script>
  <script src="js/pages/questions.js?v=3.1"></script>
  <script src="js/pages/flashcards.js?v=3.1"></script>
  <script src="js/pages/notes.js?v=3.1"></script>
  <script src="js/pages/previous-years.js?v=3.1"></script>
  <script src="js/pages/secondary.js?v=3.1"></script>
  <script src="js/app.js?v=3.1"></script>
</body>
</html>
