<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="منظومة Kuro Fangs الأكاديمية — كلية طب وجراحة الفم والأسنان السنة الثالثة" />
  <meta name="theme-color" content="#881337" />
  <title>Kuro Fangs • كلية طب وجراحة الفم والأسنان</title>

  <!-- Google Fonts: Tajawal & IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Royal Burgundy Design System Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- ==========================================================================
       THE FLOATING INTERACTIVE SUBJECT MODAL (Backdrop & Container)
       ========================================================================== -->
  <div id="subject-modal-backdrop" class="subject-modal-backdrop" aria-hidden="true">
    <div id="subject-modal-box" class="subject-modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <div class="app-wrapper">
    <!-- ==========================================================================
         TOP HEADER (Regal Burgundy Brand & Quick Navigation)
         ========================================================================== -->
    <header class="site-header">
      <!-- Right: Platform Brand -->
      <a href="#/" class="header-brand">
        <div class="brand-emblem">🦷</div>
        <div class="brand-meta">
          <span class="brand-name-text">Kuro Fangs</span>
          <span class="brand-sub-text">كلية طب وجراحة الفم والأسنان — السنة الثالثة</span>
        </div>
      </a>

      <!-- Center: Live Search Filter -->
      <div class="header-search-box">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="header-search-input" placeholder="ابحث عن أي مادة أو شيت أو موضوع..." />
      </div>

      <!-- Left: Header Navigation Actions -->
      <div class="header-actions">
        <a href="#/" class="header-nav-btn active" title="المواد الدراسية الـ 12">
          <i data-lucide="book-open"></i>
          <span>المواد (12)</span>
        </a>

        <a href="#/calculator" class="header-nav-btn" title="حاسبة المعدل التراكمي">
          <i data-lucide="calculator"></i>
          <span>حاسبة المعدل</span>
        </a>

        <a href="#/favorites" class="header-nav-btn" title="المفضلة والمحفوظات">
          <i data-lucide="bookmark"></i>
          <span>المفضلة</span>
        </a>

        <a href="#/notes" class="header-nav-btn" title="الملاحظات السريرية">
          <i data-lucide="edit-3"></i>
          <span>ملاحظاتي</span>
        </a>

        <!-- Points Pill -->
        <div class="points-pill" title="الرصيد الأكاديمي التفاعلي">
          <i data-lucide="sparkles"></i>
          <span id="header-points-text">25 نقطة</span>
        </div>
      </div>
    </header>

    <!-- ==========================================================================
         MAIN CONTENT AREA (Subjects-First Direct View)
         ========================================================================== -->
    <main class="main-content" id="app" role="main"></main>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components/subject-modal.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/calculator.js"></script>
  <script src="js/pages/quizzes.js"></script>
  <script src="js/pages/questions.js"></script>
  <script src="js/pages/flashcards.js"></script>
  <script src="js/pages/notes.js"></script>
  <script src="js/pages/previous-years.js"></script>
  <script src="js/pages/secondary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
