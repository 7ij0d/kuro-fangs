<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

  <meta charset="UTF-8" />

  <link rel="canonical" href="https://kurofangs.id.ly/" />

  <meta property="og:description" content="Kuro Fangs Dental Platform — Year 3 Dentistry Academic System (Academia Edition)" />

  <!-- Google Fonts: Inter (English & Numbers) & IBM Plex Sans Arabic (Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons & Performance Debouncer -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    (function() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        const _origCreateIcons = window.lucide.createIcons.bind(window.lucide);
        let _lucideRaf = null;
        window.lucide.createIcons = function(options) {
          if (_lucideRaf) cancelAnimationFrame(_lucideRaf);
          _lucideRaf = requestAnimationFrame(function() {
            _origCreateIcons(options);
            _lucideRaf = null;
          });
        };
      }
    })();
  </script>

  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PDF.js Engine CDN for in-browser PDF rendering & note annotation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css?v=9.0" />
  <link rel="stylesheet" href="css/base.css?v=9.0" />
  <link rel="stylesheet" href="css/layout.css?v=9.0" />
  <link rel="stylesheet" href="css/components.css?v=9.0" />
  <!-- Final product polish: paper-like study surface and touch-first controls -->
  <link rel="stylesheet" href="css/polish.css?v=9.0" />
</head>
<body id="app-body" data-layout="dark-sidebar">
  <!-- ==========================================================================
       THE FLOATING INTERACTIVE SUBJECT MODAL (Backdrop & Container with Blur)
       ========================================================================== -->
  <div id="subject-modal-backdrop" class="subject-modal-backdrop" aria-hidden="true">
    <div id="subject-modal-box" class="subject-modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Mobile Sidebar Backdrop (Blur) -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- ==========================================================================
       APP MASTER LAYOUT (Academia Dark Sidebar + Content Wrapper)
       ========================================================================== -->
  <div class="app-layout">
    <!-- 1. ACADEMIA DARK SIDEBAR (#1E1E2D) -->
    <aside id="app-sidebar" class="app-sidebar" aria-label="Main Navigation">
      <!-- Sidebar Brand Header -->
      <div class="sidebar-header">
        <a href="#/" class="sidebar-brand">
          <div class="sidebar-brand-emblem" style="display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0284C7, #0369A1); box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35); border-radius: 11px;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #FFFFFF;">
              <path d="M12 2C7.5 2 4 4.5 4 8c0 3 1.5 6 3 9 1 2 2 5 3 5s2-3 2-5c0-1.5.5-2 0-3-.5-1-1-1.5-1-2.5 0-1.5 1-2.5 1-2.5s1 1 1 2.5c0 1-.5 1.5-1 2.5-.5 1 0 1.5 0 3 0 2 1 5 2 5s2-3 3-5c1.5-3 3-6 3-9 0-3.5-3.5-6-8-6z" fill="rgba(255,255,255,0.18)"/>
            </svg>
          </div>
          <div class="sidebar-brand-meta">
            <span class="sidebar-brand-title">Kuro Fangs</span>
            <span class="sidebar-brand-sub" id="sidebar-brand-sub">Dentistry • Year 3</span>
          </div>
        </a>
        <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close sidebar">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>

      <!-- Navigation Menu -->
      <nav class="sidebar-nav">
        <!-- LEARNING Section -->
        <div class="sidebar-section-title" id="side-sec-learning">LEARNING</div>

        <a href="#/" class="sidebar-menu-item active" data-route="/">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="home"></i></span>
          <span class="sidebar-menu-text" id="side-nav-home">Home</span>
        </a>

        <a href="#/sheets" class="sidebar-menu-item" data-route="/sheets">
          <span class="sidebar-menu-icon-wrap"><img src="assets/icons/sheets_cat.png" alt="Sheets" class="sidebar-cat-icon" width="20" height="20" loading="lazy" /></span>
          <span class="sidebar-menu-text" id="side-nav-sheets">Sheets & Lectures</span>
        </a>

        <a href="#/recordings" class="sidebar-menu-item" data-route="/recordings">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="headphones"></i></span>
          <span class="sidebar-menu-text" id="side-nav-videos">Audio</span>
        </a>

        

        <a href="#/questions" class="sidebar-menu-item" data-route="/questions">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="help-circle"></i></span>
          <span class="sidebar-menu-text" id="side-nav-questions">Questions</span>
        </a>

        <!-- MY SPACE Section -->
        <div class="sidebar-section-title" id="side-sec-myspace">MY SPACE</div>

        <a href="#/lecture-schedule" class="sidebar-menu-item" data-route="/lecture-schedule">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="book-open"></i></span>
          <span class="sidebar-menu-text" id="side-nav-lecture-schedule">جدول المحاضرات النظري</span>
        </a>

        <a href="#/practical-schedule" class="sidebar-menu-item" data-route="/practical-schedule">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="microscope"></i></span>
          <span class="sidebar-menu-text" id="side-nav-practical-schedule">جدول المعامل والعملي</span>
        </a>

        <a href="#/exams" class="sidebar-menu-item" data-route="/exams">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="calendar"></i></span>
          <span class="sidebar-menu-text" id="side-nav-exams-schedule">جداول الامتحانات الرسمية</span>
        </a>

        <!-- MORE Section -->
        <div class="sidebar-section-title" id="side-sec-more">MORE</div>

        <a href="#/rewards" class="sidebar-menu-item" data-route="/rewards">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="sparkles"></i></span>
          <span class="sidebar-menu-text" id="side-nav-rewards">Mascot Hub</span>
        </a>

        <a href="#/games" class="nav-item sidebar-menu-item" data-route="/games">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="gamepad-2"></i></span>
          <span class="sidebar-menu-text" id="side-nav-games">Games</span>
        </a>

        <!-- Admin Portal -->
        <a href="#/admin" class="sidebar-menu-item sidebar-admin-link" data-route="/admin">
          <span class="sidebar-menu-icon-wrap"><i data-lucide="shield-check"></i></span>
          <span class="sidebar-menu-text" id="side-nav-admin">Admin Portal</span>
        </a>
      </nav>

      <!-- Sidebar Footer (Student Profile & Equipped Mascot) -->
      <div class="sidebar-footer">
        <a href="#/rewards" class="sidebar-user-card" title="Kuro Theme Hub & Student Profile">
          <div class="sidebar-user-avatar">
            <img id="sidebar-user-avatar-img" src="assets/characters/kuro/Kuro-Idle.png" alt="Kuro Mascot" class="mascot-avatar-img sidebar-mascot" width="40" height="40" loading="lazy" />
          </div>
          <div class="sidebar-user-meta">
            <span class="sidebar-user-name">Dental Student</span>
            <span class="sidebar-user-sub" id="sidebar-user-sub">Year 3 Dentistry</span>
          </div>
        </a>
      </div>
    </aside>

    <!-- 2. MAIN APPLICATION CONTENT WRAPPER -->
    <div class="app-main-wrapper">
      <!-- TOP HEADER (Clean White with Sticky Header) -->
      <header class="site-header">
        <div class="header-left">
          <!-- Mobile Menu Toggle Button -->
          <button id="sidebar-toggle-btn" class="header-icon-btn mobile-toggle-btn" aria-label="Toggle Sidebar Menu">
            <i data-lucide="menu"></i>
          </button>

          <!-- Search Box -->
          <div class="header-search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="header-search-input" placeholder="Search subjects, lectures, or topics..." />
          </div>
        </div>

        <!-- Header Actions: Notifications, Auth, Language, Theme, Points & Mascot Profile -->
        <div class="header-actions">
          <!-- Notifications Bell Trigger -->
          <div class="notifications-bell-wrapper" id="notifications-bell-wrapper">
            <button id="header-notifications-btn" class="header-toggle-btn notifications-bell-btn" title="الإشعارات والأخبار | Notifications" aria-label="Notifications">
              <i data-lucide="bell"></i>
              <span id="notifications-badge" class="notifications-badge" style="display: none;">0</span>
            </button>
          </div>

          <!-- Optional Supabase Auth / User Badge -->
          <div id="header-auth-action-box" class="header-auth-action-box"></div>

          <!-- Language Toggle Button (EN / AR) -->
          <button id="lang-toggle-btn" class="header-toggle-btn" title="Switch Language (English / العربية)">
            <i data-lucide="globe"></i>
            <span id="lang-btn-text">AR</span>
          </button>

          <!-- Theme Toggle Button (Dark / Light) -->
          <button id="theme-toggle-btn" class="header-toggle-btn" title="Toggle Dark / Light Theme">
            <i data-lucide="moon" id="theme-icon"></i>
          </button>

          <!-- Sound Effects Toggle Button (Mute / Unmute) -->
          <button id="sound-toggle-btn" class="header-toggle-btn" title="المؤثرات الصوتية | Sound Effects (Mute / Unmute)" aria-label="Toggle Sound Effects">
            <i data-lucide="volume-2" id="sound-icon"></i>
          </button>

          <!-- Academic Points Pill (Clickable to /rewards) -->
          <a href="#/rewards" class="points-pill" title="Academic Points — Open Mascot Hub">
            <i data-lucide="sparkles"></i>
            <span id="header-points-text">25 pts</span>
          </a>

          <!-- Top Header Kuro Mascot Profile Avatar Button -->
          <a href="#/rewards" class="header-mascot-avatar-btn" id="header-mascot-btn" title="Kuro Theme Hub & Rewards">
            <img id="header-mascot-avatar-img" src="assets/characters/kuro/Kuro-Idle.png" alt="Kuro Mascot" class="header-mascot-img" width="36" height="36" loading="lazy" />
            <span class="header-mascot-pulse"></span>
          </a>
        </div>
      </header>

      <!-- MAIN ROUTED CONTENT CONTAINER -->
      <main class="main-content" id="app" role="main"></main>
    </div>
  </div>
